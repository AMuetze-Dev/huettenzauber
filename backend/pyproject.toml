[project]
name = "huettenzauber-backend"
version = "0.1.0"
description = "Hüttenzauber POS – FastAPI Backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.1,<1",
    "uvicorn[standard]>=0.35.0,<1",
    "sqlalchemy>=2.0.41,<3",
    "psycopg2-binary>=2.9.10,<3",
    "pydantic>=2.11.7,<3",
    "pydantic-settings>=2.5.2,<3",
    "alembic>=1.13.2,<2",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1,<9",
    "httpx>=0.28.1,<1",
    "testcontainers[postgresql]>=4.8.0,<5",
    "pytest-cov>=5.0.0,<7",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:core.config",
]

[tool.uv]
package = false
