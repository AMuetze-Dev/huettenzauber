# Prod-Frontend: liefert das gebaute SPA-Bundle und reicht /api ans Backend weiter.
# In Prod ist dieser Container der einzige Einstiegspunkt (Port 80) - kein
# separater Proxy noetig.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events (Kundendisplay)
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri /index.html;
    }

    large_client_header_buffers 4 16k;
}
