name: huettenzauber

# Entwicklungs-Stack: Bind-Mounts + Hot-Reload. Fuer Produktion:
#   docker compose -f docker-compose.prod.yml up -d --build

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-root}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
  POSTGRES_DB: ${POSTGRES_DB:-huettenzauber}

services:
  db:
    image: postgres:17-bookworm
    container_name: huettenzauber_db
    restart: unless-stopped
    environment: *db-env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-huettenzauber}"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [huettenzauber]

  backend:
    build: ./backend
    container_name: huettenzauber_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-root}@db:5432/${POSTGRES_DB:-huettenzauber}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost}
      # Wie in der Produktion: sonst schreibt der Container UTC in Logs und
      # Sicherungsnamen, und Entwicklung und Pi weichen um zwei Stunden ab.
      TZ: ${TZ:-Europe/Berlin}
    command:
      - sh
      - -c
      - "uv run --no-sync alembic upgrade head && exec uv run --no-sync uvicorn app:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks: [huettenzauber]

  frontend:
    build:
      context: ./frontend
      target: builder
    container_name: huettenzauber_frontend
    restart: unless-stopped
    environment:
      VITE_API_TARGET: http://backend:8000
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks: [huettenzauber]

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: huettenzauber_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - db
    networks: [huettenzauber]

networks:
  huettenzauber:

volumes:
  pgdata:
